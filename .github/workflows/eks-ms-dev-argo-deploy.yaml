name: EKS microservices dev argo deploy

# argo-dev only. Builds images once and writes the new tags into the dev Helm values.
# Prod reuses these same images; it does not build.

on:
  push:
    branches:
      - argo-dev
    paths:
      - 'production-eks-env/multi-env-eks-stuff/eks-microservices/app/**'
  workflow_dispatch:

env:
  AWS_ACCOUNT_ID: 879381241087
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::879381241087:role/aws-github-oidc-aug26
  ECR_REGISTRY: 879381241087.dkr.ecr.ap-south-1.amazonaws.com
  DEPLOY_BRANCH: argo-dev
  VALUES_FILE: production-eks-env/multi-env-eks-stuff/eks-microservices/environments/dev/value.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        services:
          - name: frontend
            path: production-eks-env/multi-env-eks-stuff/eks-microservices/app/frontend
            ecr_repo: dev-ecommerce-frontend
          - name: api-gateway
            path: production-eks-env/multi-env-eks-stuff/eks-microservices/app/api-gateway
            ecr_repo: dev-ecommerce-api-gateway
          - name: user-service
            path: production-eks-env/multi-env-eks-stuff/eks-microservices/app/services/user-service
            ecr_repo: dev-ecommerce-user-service
          - name: product-service
            path: production-eks-env/multi-env-eks-stuff/eks-microservices/app/services/product-service
            ecr_repo: dev-ecommerce-product-service
          - name: cart-service
            path: production-eks-env/multi-env-eks-stuff/eks-microservices/app/services/cart-service
            ecr_repo: dev-ecommerce-cart-service
          - name: order-service
            path: production-eks-env/multi-env-eks-stuff/eks-microservices/app/services/order-service
            ecr_repo: dev-ecommerce-order-service
          - name: payment-service
            path: production-eks-env/multi-env-eks-stuff/eks-microservices/app/services/payment-service
            ecr_repo: dev-ecommerce-payment-service
          - name: notification-service
            path: production-eks-env/multi-env-eks-stuff/eks-microservices/app/services/notification-service
            ecr_repo: dev-ecommerce-notification-service
          - name: seed
            path: production-eks-env/multi-env-eks-stuff/eks-microservices/app/seed-job
            ecr_repo: dev-ecommerce-seed

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: argo-dev

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: aws creds with oidc
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ecr login
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and Push ${{ matrix.services.name }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.services.ecr_repo }}:${{ github.sha }} \
            --cache-from type=registry,ref=${{ env.ECR_REGISTRY }}/${{ matrix.services.ecr_repo }}:buildcache \
            --cache-to type=registry,ref=${{ env.ECR_REGISTRY }}/${{ matrix.services.ecr_repo }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true \
            --push ${{ matrix.services.path }}

  update-dev-values:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout argo-dev
        uses: actions/checkout@v3
        with:
          ref: argo-dev

      - name: Point dev values at the new images
        run: |
          SHA="${GITHUB_SHA}"

          for repo in \
            dev-ecommerce-product-service \
            dev-ecommerce-user-service \
            dev-ecommerce-cart-service \
            dev-ecommerce-order-service \
            dev-ecommerce-payment-service \
            dev-ecommerce-notification-service \
            dev-ecommerce-api-gateway \
            dev-ecommerce-frontend \
            dev-ecommerce-seed
          do
            image="${ECR_REGISTRY}/${repo}:${SHA}"
            short="${repo#dev-}"
            sed -i -E "s|(image:[[:space:]]*).*${short}:[^[:space:]]*|\1${image}|" "${VALUES_FILE}"
            if ! grep -q "${image}" "${VALUES_FILE}"; then
              echo "failed to set ${repo}"
              exit 1
            fi
            echo "${repo} -> ${image}"
          done

      - name: Commit and push dev values to argo-dev
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/${DEPLOY_BRANCH}" ]; then
            echo "refusing to push from ${GITHUB_REF}; dev deploy only pushes to ${DEPLOY_BRANCH}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${VALUES_FILE}"
          if git diff --cached --quiet; then
            echo "Images already match ${GITHUB_SHA}; nothing to commit"
            exit 0
          fi
          git commit -m "chore(gitops): bump dev ecommerce images to ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:refs/heads/argo-dev
